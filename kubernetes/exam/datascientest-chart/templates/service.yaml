apiVersion: v1
kind: Service
metadata:
  name: {{ include "datascientest-chart.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    {{- include "datascientest-chart.selectorLabels" . | nindent 4 }}
